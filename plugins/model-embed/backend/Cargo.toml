[package]
name = "cc-model-embed"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
publish = false
description = "CortexModelServer model plugin (model@1, kind embed): the knowledge app's embedder copied as is (src/embedding): bekko-embedding-v1-a8m on candle ModernBERT, answering model.embed."

# Own workspace: the plugin builds (and ships) on its own.
[workspace]

[[bin]]
name = "cc-model-embed"
path = "src/main.rs"

[dependencies]
cc-protocol = { path = "../../../protocol", features = ["model", "preserve_order"] }
# The models folder the Cortex apps share (~/.cortex-models), where the embedders live.
cc-shared-models = { path = "../../../shared-models" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
sha2 = "0.10.9"
# What the knowledge app's embedding module (src/embedding, copied from its adapters crate) needs, at
# the versions and features that crate uses (its `embed` feature).
embed-common = { path = "embed-common" }
parking_lot = "0.13"
rayon = "1"
ureq = "3"
candle-core = "=0.10.2"
candle-nn = "=0.10.2"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

# Apple builds run ModernBERT on Metal, with Accelerate for the CPU path (as the knowledge app's do).
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.10.2", features = ["metal", "accelerate"] }
candle-nn = { version = "=0.10.2", features = ["metal", "accelerate"] }

[features]
# The copied module is gated on the knowledge app's features: `embed` (bekko) is on; `onnx-embed` (the
# bindings' registered ONNX models, which no Cortex app uses) stays off.
default = ["embed"]
embed = []
onnx-embed = []

[profile.release]
debug = false
lto = "thin"
