[package]
name = "cc-model-relex"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexModelServer model plugin (model@1, kind extract): GLiNER-relex large on candle, the knowledge app's relex lane copied as is (src/relex), answering model.extract."

# Own workspace: the plugin builds (and ships) on its own.
[workspace]

[[bin]]
name = "cc-model-relex"
path = "src/main.rs"

[dependencies]
cc-protocol = { path = "../../../protocol", features = ["model", "preserve_order"] }
# The models folder the Cortex apps share (~/.cortex-models), where GLiNER-relex lives.
cc-shared-models = { path = "../../../shared-models" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
sha2 = "0.10.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
# The knowledge app's relex lane (src/relex, copied from its model-worker): exactly the worker's
# dependencies and features. candle reads the weights straight from the model folder's
# safetensors; Metal or CUDA when the build and the machine have it, else the CPU.
anyhow = "1.0"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
candle-core = "0.11"
candle-nn = "0.11"
regex = "1"

[features]
default = []
# Linux with an NVIDIA GPU: `cargo build --release --features cuda` (needs the CUDA toolkit).
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11", features = ["metal", "accelerate"] }

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
opt-level = 3
