# Recipes for model-llama (llama.cpp 468ad58 with CortexTerm's 4 patches; plugins/model-llama).
#
# Sizes come from the plugin's catalog.rs (pinned files). KV per token is computed from each
# model's architecture at the recipe's default kv type:
#
# - Gemma 4 (GGUF metadata of the E4B file; google/gemma-4-E2B-it config.json for E2B): only the
#   layers before the shared-KV layers hold a cache (llama.cpp `n_layer_kv_from_start`). Of those,
#   the full-attention layers grow with context (counted in kv_bytes_per_token); the sliding-window
#   layers hold n_swa * slots + ubatch cells whatever the context (llama-kv-cache-iswa.cpp with
#   --kv-unified, counted in compute_bytes).
#     E4B: 42 layers, 18 shared -> 24 with KV: 4 full (2 KV heads x 512) + 20 SWA (2 x 256),
#          window 512. Full: 4 * 2 * (512 + 512) * 2 B = 16384 B/token (f16).
#          SWA: 20 * 2 * (256 + 256) * 2 B = 40960 B/cell; 2 slots: (2 * 512 + 2048) cells = 126 MB;
#          1 slot: 2560 cells = 105 MB.
#     E2B: 35 layers, 20 shared -> 15 with KV: 3 full (1 KV head x 512) + 12 SWA (1 x 256).
#          Full: 3 * 1 * 1024 * 2 B = 6144 B/token. SWA: 12288 B/cell * 3072 = 38 MB.
# - Qwen3.8-27B (64 layers: 48 Gated DeltaNet + 16 full attention, 4 KV heads x 256; from the
#   same model's trymirai config.json): 16 * 4 * (256 + 256) elements per token; q8_0 is 34 bytes
#   per 32 elements: 34816 B/token (65536 at f16). The DeltaNet state is fixed per slot
#   (48 layers * 48 heads * 128 * 128 * 4 B + conv state, about 157 MB a slot), in compute_bytes.
#
# compute_bytes are estimates (SWA or recurrent state + llama.cpp compute buffers + the drafter's
# own cache) until the serve plugin's calibration measures them.
#
# ctx: for Gemma (`--kv-unified`) ctx is the ONE pool all slots share (KV = kv_bytes_per_token *
# ctx), counted in 32k shares (ctx_share): one share per slot, and a call books the shares it
# states (ClaimParams.tokens), so the report call's four shares run on top of the normal slots; for
# Qwen ctx is per slot (KV = kv_bytes_per_token * ctx * slots). Exactly as the origins run them.
#
# Not here: LFM2.5-1.2B. LiquidAI publishes an official GGUF repo (LiquidAI/LFM2.5-1.2B-Instruct-GGUF),
# but no app runs LFM on llama.cpp, so there are no origin settings to copy (the knowledge app runs it on uzu).

[[recipe]]
id = "gemma-4-e4b-qat-llama"
name = "Gemma 4 E4B"
engine = "model-llama"
origin = "CortexTerm / the knowledge app"
kind = "chat"
family = "gemma4"
tags = ["office"]
platforms = ["macos", "linux"]
backends = ["metal", "cuda", "vulkan"]
repo = "unsloth/gemma-4-E4B-it-qat-GGUF"
revision = "8c5a9e4fd5482e2be20fe0bf013b4c262a8f4265"
weights_bytes = 4275373792        # UD-Q4_K_XL 4_215_695_776 + MTP head 59_678_016
compute_bytes = 900000000         # SWA 126 MB + compute buffers (ubatch 2048) + MTP head cache (estimate)
kv_bytes_per_token = 16384        # f16, full-attention layers only; ctx is the shared pool
min_gpu_bytes = 9663676416        # 9 GiB: CortexTerm offers E4B above 8 GiB
ctx_share = 32768                 # the pool is one 32k share per slot: a normal call books one, the knowledge app's report call books four (ClaimParams.tokens)
ctx_default = 65536               # two shares, as CortexTerm runs it alone; a lane runs one share per slot plus the shares of the biggest call any app states
slots_default = 2                 # normal calls side by side, as CortexTerm runs it; no limit of ours on more (memory bounds them)
vision = false
speculative = "mtp"

[recipe.config]
variant = "gemma-4-e4b-qat"
ctx = 65536
parallel = 2
ubatch = 2048
kv_type = "f16"
draft_max = 4
cache_ram = 1024
checkpoints = 2

[recipe.keys]
slots = "parallel"
ctx = "ctx"
cache_ram = "cache_ram"          # MiB
checkpoints = "checkpoints"
kv_type = "kv_type"
speculative = ""
draft_max = "draft_max"
idle_unload_s = "idle_unload_s"
memory_limit = ""

