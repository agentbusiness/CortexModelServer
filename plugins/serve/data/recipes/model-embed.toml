# Recipes of the model-embed engine plugin (schema: README.md). bekko, the embedder every Cortex app
# uses, with the knowledge app's settings: 384-dim vectors, mean-pooled and L2-normalized, at most 512 tokens per text, batches of
# 32 (ModernBERT orders each batch by length), 4 CPU threads.

[[recipe]]
id = "bekko-a8m-embed"
name = "bekko-embedding-v1-a8m"
engine = "model-embed"
origin = "the knowledge app"
kind = "embed"
family = "modernbert"
tags = ["embed"]
platforms = ["macos", "linux"]
backends = ["metal", "cpu"]             # the knowledge app's ModernBERT has no CUDA path
repo = "hotchpotch/bekko-embedding-v1-a8m"
revision = "c721113d59a1d91b447450324f51c4b3332c924a"
# Files 246,317,545 bytes (present in ~/.cortex-models: 235 MiB). Resident: the bf16 token table
# (197 MB) as stored, the other 7.7 M weights widened to f32 (31 MB), rotary tables (4 MB).
weights_bytes = 232000000
# 32 texts x 512 tokens: attention scores of 6 heads are 201 MB a layer.
compute_bytes = 640000000
kv_bytes_per_token = 0
min_gpu_bytes = 1073741824
ctx_default = 0
ctx_max = 0
slots_default = 1
slots_max = 1
vision = false
speculative = "none"

[recipe.config]
model = "bekko-embedding-v1-a8m"
batch_size = 32
threads = 4
prefer_gpu = true
max_input_tokens = 512
idle_unload_s = 300

[recipe.keys]
slots = ""
ctx = ""
cache_ram = ""
checkpoints = ""
kv_type = ""
speculative = ""
idle_unload_s = "idle_unload_s"
memory_limit = ""
