[[recipe]]
id = "lfm2.5-1.2b-uzu"
name = "LFM2.5-1.2B"
engine = "model-uzu"
origin = "the knowledge app"
kind = "chat"
family = "lfm2.5"
tags = ["rapid"]
platforms = ["macos"]
backends = ["metal"]
# The knowledge app's rapid lane (model-worker on uzu), as the plugin's lfm2.5-1.2b-m variant carries it
# (CortexModelServer patch, fixed whatever the lane config says): greedy, 32,768 tokens per
# conversation (min(model max 128,000, 32768)), prefill chunk 1024, 24 shared prefix snapshots,
# llguidance JSON schema with the knowledge app's compact separators; the model's own chat template. The knowledge app
# runs one process with one request at a time. On disk (du): 638,758,912 B.
repo = "trymirai/LFM2.5-1.2B-Instruct-M"
revision = "ecdf2af005f28d483cfe87549897c877e5cf69bf"
weights_bytes = 633981000          # model.safetensors (tokenizer.json 4,733,389 B, config.json 37,022 B)
compute_bytes = 3221225472         # COMPUTE_RESERVE 3 GiB
kv_bytes_per_token = 6336          # int8: 6 attention layers x 8 KV heads x 64 (10 short-convolution layers hold no KV); bf16 chips: 12,288
min_gpu_bytes = 8589934592         # 8 GiB Macs fit weights + 3 GiB + several 32k conversations
ctx_min_per_slot = 33792
# CortexModelServer: the pool also holds the 24 prefix snapshots, which the knowledge app keeps outside
# any pool. 8 conversations' room (1.7 GB) keeps all 24 for prefixes of several thousand tokens;
# on a smaller Mac the plan halves it, down to one conversation's 33,792.
ctx_default = 270336
ctx_max = 270336                   # 8 conversations of 33,792; one conversation never exceeds 32,768
slots_default = 1
slots_max = 8
vision = false
speculative = "none"

[recipe.config]
variant = "lfm2.5-1.2b-m"

[recipe.keys]
slots = "slots"
ctx = "ctx_total"
cache_ram = ""
checkpoints = ""
kv_type = ""
speculative = ""
idle_unload_s = "idle_unload_s"
memory_limit = "memory_limit_bytes"
