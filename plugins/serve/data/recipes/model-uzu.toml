kv_bytes_per_token = 16512         # int8: 8 attention layers x 4 KV heads x 256 (of 32 layers, 24 Gated DeltaNet); bf16 chips: 32,768
min_gpu_bytes = 17179869184        # 16 GiB: weights + 3 GiB + one 32k conversation with its state fit; 8 GB Macs do not
ctx_min_per_slot = 62512           # 32,768 + the fixed state (29,744 tokens)
ctx_default = 131072               # pool: 2 conversations at 32k + their fixed state (recurrent 52,690,944 B, 8 checkpoints: 29,744 tokens each)
ctx_max = 262144
slots_default = 2
slots_max = 8
vision = false
speculative = "none"

[recipe.config]
